[project]
name = "smart-contract-detection-xai"
version = "0.1.0"
description = "Smart Contract Vulnerability Detection using Graph Neural Networks and Explainable AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "numpy>=2.3",
    "pandas>=2.3",
    "networkx>=3.5",
    "scikit-learn>=1.7",
    "transformers>=4.57",
    "torch-geometric>=2.7",
    "pydot>=4.0",
    "ipykernel>=7.1",
    "python-dotenv>=1.0",
    "datasets>=2.16",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
